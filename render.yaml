services:
  - type: web
    name: makerset-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      # Free tier has no persistent disk: DB/uploads live on the instance
      # filesystem and reset on redeploy. Upgrade + add a disk later for permanence.
      - key: DB_FILE
        value: /app/database/makerset.db
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: CORS_ORIGIN
        value: https://www.ltcc.ee,https://ltcc.ee,https://maker-set.netlify.app
      # Code also allows https://*.netlify.app deploy previews automatically.
      - key: PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
